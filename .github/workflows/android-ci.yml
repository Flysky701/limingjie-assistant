name: UI preview APK

on:
  push:
    branches: [codex/ui-compile-validation]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Package the account and strategy UI preview
        working-directory: android
        run: bash ./gradlew :app:assembleDebug -PcoexistSuffix=.ui.preview --no-daemon
      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: limingjie-ui-preview-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
